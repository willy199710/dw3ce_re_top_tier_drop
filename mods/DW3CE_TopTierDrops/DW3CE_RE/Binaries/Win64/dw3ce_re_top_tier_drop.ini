; DW3CE in-memory patches (loaded by version.dll). Restart the game after editing.
[Patches]
; Element of dropped weapons (needs AttributeProbability=100 in the data mod to always have one):
;   0 = random (vanilla)   1 = Fire   2 = Lightning   3 = Slash   4 = Wind
Element=3
; 1 = on, 0 = off for everything below
; weapon skill values (and field item values) always roll the top of their tier
MaxSkillRoll=1
; guard weapon skill values always roll their max
MaxGuardSkillRoll=1
; field-dropped guard (bodyguard) skill items always roll the top of their tier
MaxGuardItemRoll=1
; REQUIRED by the data mod (SkillItemRandRank=[0,0,0,0,100]): weapons/guard weapons fall back to tier 3.
; Turning these off makes weapon / guard weapon skill values drop to the LOWEST tier.
SkillTierFix=1
GuardTierFix=1
; items dropped by defeated enemies (meat bun / arrows / ATK up / DEF up) are always upgraded one size,
; instead of only when the combo count is high enough (vanilla: combo/8 must exceed the current size)
ComboUpgradeAlways=1
